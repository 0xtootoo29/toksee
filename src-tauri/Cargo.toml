[package]
name = "toksee"
version = "0.1.0"
description = "TokSee · Token usage tracker for AI coding tools"
authors = ["too"]
edition = "2021"

[lib]
name = "toksee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.6"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
