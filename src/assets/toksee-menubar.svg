    <rect x="34" y="40" width="8" height="38" rx="2"/>
    <rect x="46" y="50" width="8" height="28" rx="2"/>
    <rect x="58" y="22" width="8" height="56" rx="2"/>
    <rect x="70" y="35" width="8" height="43" rx="2"/>
  </g>
</svg>
