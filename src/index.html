<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokSee · v3 — three schemes, taller frame</title>
<style>
  /* =========================================================
     TOKSEE — popover-as-window layout (Tauri 380×540 transparent)
     ========================================================= */
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh; overflow: hidden;
    background: transparent;
    color: var(--text-primary, #cfd1d4);
    font: 12px/1.5 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }

  /* The frame is the visible window. .frame::before paints the scheme-
     specific "backdrop" (gradient or solid) that the translucent popover
     surface bleeds through (vibrancy effect). */
  .frame {
    width: 100vw; height: 100vh;
    position: relative; isolation: isolate;
    border-radius: var(--frame-radius, 14px);
    overflow: hidden;
  }
  .frame::before {
    content: "";
    position: absolute; inset: 0;
    background: var(--frame-stage, transparent);
    z-index: 0;
    transition: background 400ms cubic-bezier(.32,.72,0,1);
  }

  /* =================================================================
     SHARED COMPONENT CSS
     ================================================================= */
  .popover {
    position: absolute; inset: 0; z-index: 1;
    background: var(--popover-bg);
    backdrop-filter: var(--popover-backdrop, none);
    -webkit-backdrop-filter: var(--popover-backdrop, none);
    border: var(--popover-border);
    border-radius: var(--popover-radius);
    box-shadow: var(--popover-shadow, none);
    color: var(--text-primary);
    font-family: var(--font-sans);
    overflow: hidden;
    display: flex; flex-direction: column;
    transition:
      background 400ms cubic-bezier(.32,.72,0,1),
      backdrop-filter 400ms cubic-bezier(.32,.72,0,1),
      border-radius 400ms cubic-bezier(.32,.72,0,1),
      box-shadow 400ms cubic-bezier(.32,.72,0,1);
  }
  .popover * { box-sizing: border-box; }
  .popover button { background: transparent; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* Header */
  .pop-header {
    height: 36px; flex: none;
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 10px;
    padding: 0 14px;
    border-bottom: 0.5px solid var(--divider);
    background: var(--header-bg, transparent);
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-mark { width: 14px; height: 14px; display: grid; place-items: center; color: var(--brand-color); }
  .brand-name {
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 600; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--text-primary);
  }
  .header-status {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--font-mono); font-size: 10px;
    color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.4px;
  }
  .header-status .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--pos);
    box-shadow: 0 0 0 2px color-mix(in oklab, var(--pos) 25%, transparent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .header-actions { display: flex; align-items: center; gap: 2px; }
  .icon-btn {
    width: 24px; height: 24px; display: grid; place-items: center;
    color: var(--text-tertiary); border-radius: 6px;
    transition: background 160ms, color 160ms;
  }
  .icon-btn:hover { background: var(--icon-hover-bg); color: var(--text-primary); }
  .icon-btn svg { width: 13px; height: 13px; display: block; }

  /* Hero strip */
  .strip {
    padding: 16px 16px 16px;
    border-bottom: 0.5px solid var(--divider);
    background: var(--strip-bg, transparent);
    color: var(--strip-text, inherit);
    position: relative;
  }
  .strip::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: var(--strip-overlay, transparent);
  }
  .strip > * { position: relative; z-index: 1; }
  .strip-top {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 4px;
  }
  .strip-label {
    font-family: var(--font-mono);
    font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .strip-label .accent-bar {
    display: inline-block; width: 8px; height: 8px;
    background: var(--strip-accent-bar, var(--accent));
    margin-right: 6px; vertical-align: -1px;
    border-radius: var(--accent-bar-radius, 0);
  }
  .strip-label, .strip-period { color: var(--strip-label-color, var(--text-tertiary)); }
  .strip-value { color: var(--strip-value-color, var(--text-primary)); }
  .strip-period {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--text-quat); letter-spacing: 0.6px; text-transform: uppercase;
  }
  .strip-row {
    display: grid; grid-template-columns: 1fr auto;
    align-items: end; gap: 14px; margin-bottom: 12px;
  }
  .strip-value {
    font-family: var(--font-mono);
    font-size: 32px; font-weight: 500;
    line-height: 1; letter-spacing: -0.6px;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }
  /* Two-row delta chip: arrow + value on top, vs label underneath.
     Stays compact + consistent across all periods (日/周/双周/月环比),
     so long hero numbers (e.g. 1,562,953,622) never compress the vs
     label into vertical Chinese text. */
  .strip-delta {
    display: inline-flex; flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    padding: 4px 0 4px 8px;
    font-family: var(--font-mono); font-size: 11px; line-height: 1;
    border-left: 2px solid currentColor;
    color: var(--strip-neg, var(--neg));
    white-space: nowrap;
  }
  .strip-delta.up { color: var(--strip-pos, var(--pos)); }
  .strip-delta .delta-line { display: inline-flex; align-items: baseline; gap: 3px; font-weight: 600; }
  .strip-delta .arrow { font-weight: 600; font-size: 9px; }
  .strip-delta .vs { font-size: 9px; opacity: 0.65; letter-spacing: 0.04em; }

  .strip-cells {
    display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 0.5px solid var(--strip-divider, var(--divider));
    padding-top: 12px;
  }
  .cell {
    padding-right: 10px;
    border-right: 0.5px solid var(--strip-divider, var(--divider));
    display: flex; flex-direction: column; gap: 3px;
  }
  .cell:not(:first-child) { padding-left: 12px; }
  .cell:last-child { border-right: 0; padding-right: 0; }
  .cell-key {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.7px;
    text-transform: uppercase; color: var(--strip-key-color, var(--text-tertiary));
  }
  .cell-val {
    font-family: var(--font-mono); font-size: 13px; font-weight: 500;
    color: var(--strip-value-color, var(--text-primary)); font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .cell-val.muted { color: var(--strip-muted-color, var(--text-secondary)); font-weight: 400; }
  .cell-sub {
    font-family: var(--font-mono); font-size: 9px;
    color: var(--strip-sub-color, var(--text-quat)); letter-spacing: 0.4px;
  }

  /* Tabs — sublabels REMOVED */
  .tabs-row {
    display: flex; align-items: stretch;
    border-bottom: 0.5px solid var(--divider);
    padding: 0 8px;
  }
  .tab {
    flex: 1; height: 32px;
    display: grid; place-items: center;
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--text-tertiary);
    position: relative;
    transition: color 160ms;
  }
  .tab:hover { color: var(--text-secondary); }
  .tab.active { color: var(--text-primary); font-weight: 600; }
  .tab.active::after {
    content: "";
    position: absolute;
    left: 14px; right: 14px;
    bottom: -0.5px;
    height: 2px;
    background: var(--accent);
    border-radius: var(--tab-rule-radius, 0);
  }

  /* Chart */
  .chart {
    padding: 14px 16px 4px;
    border-bottom: 0.5px solid var(--divider);
  }
  .chart-head {
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: baseline; gap: 10px; margin-bottom: 8px;
  }
  .chart-title {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.7px;
    color: var(--text-tertiary); text-transform: uppercase;
  }
  .chart-readout {
    text-align: right; font-family: var(--font-mono); font-size: 11px;
    color: var(--text-secondary); letter-spacing: 0.4px;
  }
  .chart-readout .read-val { color: var(--text-primary); font-weight: 600; margin-left: 6px; }
  /* chart-plot: 1fr (bar area) + 60px (NOW flag column).
     60px fits "$128.32" / "$1,234.56" without truncation in mono font. */
  .chart-plot {
    position: relative; height: 76px;
    display: grid; grid-template-columns: 1fr 60px; gap: 4px;
  }
  .chart-bars {
    position: relative;
    display: flex; align-items: flex-end; gap: 3px;
    padding-bottom: 14px;
    border-bottom: 0.5px solid var(--rule-strong);
  }
  .chart-bars::before {
    content: "";
    position: absolute; inset: 0 0 14px 0;
    background-image:
      linear-gradient(to top,
        var(--grid-color) 0, var(--grid-color) 0.5px, transparent 0.5px, transparent 25%,
        var(--grid-color) 25%, var(--grid-color) calc(25% + 0.5px), transparent calc(25% + 0.5px), transparent 50%,
        var(--grid-color) 50%, var(--grid-color) calc(50% + 0.5px), transparent calc(50% + 0.5px), transparent 75%,
        var(--grid-color) 75%, var(--grid-color) calc(75% + 0.5px), transparent calc(75% + 0.5px));
    pointer-events: none;
  }
  .bar {
    flex: 1; min-width: 4px;
    background: var(--bar-color);
    transition: background 160ms;
    align-self: end; position: relative; z-index: 1;
    border-radius: var(--bar-radius, 0);
  }
  .bar:hover { background: var(--bar-peak-color); }
  .bar.peak { background: var(--bar-peak-color); }
  .bar.today { background: var(--bar-today-color); }
  .bar.zero { background: var(--text-quat); height: 1px !important; opacity: 0.4; }
  .chart-flag {
    position: relative;
    border-left: 0.5px dashed var(--accent);
    padding-left: 6px;
    align-self: stretch;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding-bottom: 14px;
  }
  .flag-tag {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.5px;
    color: var(--accent); text-transform: uppercase; line-height: 1.1; margin-bottom: 2px;
  }
  .flag-val { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--text-primary); line-height: 1.05; }
  .flag-sub { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); margin-top: 1px; }
  /* chart-axis aligns to chart-bars by mirroring its layout: same width
     (full width minus 40px flag column + 4px gap), same per-bar grid
     spacing, same gap. Each axis label uses grid-column: <i+1> to land
     on the same column as bar i — guaranteed alignment regardless of N
     bars or gap size. Empty grid cells are fine. */
  .chart-axis {
    margin-top: 6px; height: 12px;
    width: calc(100% - 64px);
    display: grid;
    gap: 3px;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.4px;
    color: var(--text-quat);
  }
  .chart-axis span {
    text-align: center;
    white-space: nowrap;
    overflow: visible;
  }
  .chart-axis span.now { color: var(--accent); font-weight: 600; }
  .chart-axis span.now { color: var(--accent); font-weight: 600; }

  /* Models — SYM column REMOVED. New grid: name | share | tok | cost */
  .models-head {
    display: grid; grid-template-columns: 1fr 64px 56px 60px;
    align-items: center; gap: 10px;
    padding: 8px 16px 4px;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.7px;
    color: var(--text-quat); text-transform: uppercase;
    border-bottom: 0.5px solid var(--divider);
  }
  .models-head .col-share, .models-head .col-tok, .models-head .col-cost { text-align: right; }
  .models {
    flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 0 0 4px;
    scrollbar-width: thin;
  }
  .models::-webkit-scrollbar { width: 4px; }
  .models::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 2px; }
  .model-row {
    display: grid; grid-template-columns: 1fr 64px 56px 60px;
    align-items: center; gap: 10px;
    padding: 8px 16px;
    border-bottom: 0.5px solid var(--hairline);
    transition: background 120ms;
  }
  .model-row:hover { background: var(--row-hover); }
  .model-row:last-child { border-bottom: 0; }
  .model-name-wrap {
    display: flex; align-items: center; gap: 8px;
    min-width: 0;
  }
  .model-dot {
    width: 8px; height: 8px;
    border-radius: var(--dot-radius, 2px);
    flex: none;
  }
  .model-row[data-model="gpt"] .model-dot { background: var(--model-gpt); }
  .model-row[data-model="opus"] .model-dot { background: var(--model-opus); }
  .model-row[data-model="sonnet"] .model-dot { background: var(--model-sonnet); }
  .model-row[data-model="haiku"] .model-dot { background: var(--model-haiku); }
  .model-name {
    font-family: var(--font-sans); font-size: 12px; font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: -0.05px;
  }
  .model-name .ver {
    color: var(--text-tertiary);
    font-size: 11px; margin-left: 3px; font-weight: 400;
  }
  .model-share { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .share-bar { flex: 1; height: 3px; background: var(--model-bar-bg); position: relative; border-radius: var(--share-radius, 0); }
  .share-bar > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; }
  .model-row[data-model="gpt"] .share-bar > span { background: var(--model-gpt); }
  .model-row[data-model="opus"] .share-bar > span { background: var(--model-opus); }
  .model-row[data-model="sonnet"] .share-bar > span { background: var(--model-sonnet); }
  .model-row[data-model="haiku"] .share-bar > span { background: var(--model-haiku); }
  .share-pct {
    font-family: var(--font-mono); font-size: 9px;
    color: var(--text-tertiary); width: 26px; text-align: right;
  }
  .model-tok {
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--text-secondary); text-align: right; font-variant-numeric: tabular-nums;
  }
  .model-cost {
    font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    color: var(--text-primary); text-align: right; font-variant-numeric: tabular-nums;
  }

  /* Footer — tightened ticker */
  .footer {
    flex: none; height: 30px;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center; gap: 10px;
    padding: 0 14px;
    border-top: 0.5px solid var(--divider);
    background: var(--footer-bg);
    font-family: var(--font-mono); font-size: 10px;
    color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.4px;
  }
  .footer .next-update { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .footer .next-update b {
    color: var(--text-primary); font-weight: 600; letter-spacing: 0.6px;
  }
  /* Compact ticker — small chips, fits within minmax(0,1fr) */
  .footer .ticker {
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    min-width: 0; overflow: hidden;
  }
  .footer .chip {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 9px; letter-spacing: 0.3px;
    color: var(--text-quat);
    flex: none;
  }
  .footer .chip .sym {
    color: var(--text-tertiary); font-weight: 600;
    letter-spacing: 0.4px;
  }
  .footer .chip .val {
    font-variant-numeric: tabular-nums;
  }
  .footer .chip.pos .val { color: var(--pos); }
  .footer .chip.neg .val { color: var(--neg); }
  .footer-link {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--text-primary); font-weight: 600;
    letter-spacing: 0.6px; text-decoration: none;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 1px; line-height: 1;
    cursor: pointer; white-space: nowrap;
  }
  .footer-link:hover { color: var(--accent); }

  /* =================================================================
     ============================ SCHEMES ============================
     ================================================================= */

  /* ============== Settings menu (per-popover) ============== */
  .settings-menu {
    position: absolute; top: 32px; right: 8px;
    width: 232px; z-index: 10;
    background: var(--popover-bg);
    backdrop-filter: var(--popover-backdrop, none);
    -webkit-backdrop-filter: var(--popover-backdrop, none);
    border: 0.5px solid var(--divider);
    border-radius: 12px;
    box-shadow: 0 14px 36px rgba(0,0,0,0.30), 0 1px 0 rgba(255,255,255,0.05) inset;
    padding: 0;
    opacity: 0; transform: translateY(-6px) scale(0.97);
    transform-origin: top right;
    pointer-events: none;
    transition: opacity 180ms ease, transform 180ms cubic-bezier(.32,.72,0,1);
    font-family: var(--font-sans);
    overflow: hidden;
  }
  .settings-menu.open { opacity: 1; transform: none; pointer-events: auto; }
  .menu-section { padding: 10px 10px 8px; }
  .menu-section + .menu-section { border-top: 0.5px solid var(--divider); }
  .menu-label {
    font-family: var(--font-mono);
    font-size: 9px; letter-spacing: 0.7px; text-transform: uppercase;
    color: var(--text-tertiary); margin-bottom: 7px;
  }
  .menu-seg {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    background: var(--menu-seg-bg, rgba(0,0,0,0.05));
    border-radius: 8px; padding: 2px; gap: 0;
  }
  .menu-seg-btn {
    background: transparent; border: 0; cursor: pointer;
    padding: 6px 4px;
    font: 500 11px var(--font-sans);
    color: var(--text-secondary);
    border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    transition: background 150ms ease, color 150ms ease, box-shadow 150ms ease;
    white-space: nowrap;
  }
  .menu-seg-btn:hover { color: var(--text-primary); }
  .menu-seg-btn.active {
    background: var(--popover-bg);
    color: var(--text-primary);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 0 0 0.5px var(--divider);
  }
  .menu-seg-btn svg { width: 11px; height: 11px; flex: none; }
  .menu-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 2px; gap: 10px;
    font-size: 12px; color: var(--text-primary);
  }
  .menu-row .lhs { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .menu-row .lhs svg { width: 13px; height: 13px; color: var(--text-tertiary); flex: none; }
  .menu-toggle {
    width: 30px; height: 18px; border-radius: 999px; flex: none;
    background: rgba(120,120,128,0.30);
    position: relative; cursor: pointer; border: 0; padding: 0;
    transition: background 200ms;
  }
  .menu-toggle::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.20), 0 0.5px 0 rgba(0,0,0,0.04);
    transition: transform 200ms cubic-bezier(.32,.72,0,1);
  }
  .menu-toggle.on { background: var(--accent); }
  .menu-toggle.on::after { transform: translateX(12px); }
  .scheme-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--swatch);
    box-shadow: 0 0 0 0.5px rgba(0,0,0,0.10);
    flex: none;
  }
  .budget-row { padding-bottom: 2px; }
  .budget-controls { display: inline-flex; align-items: center; gap: 8px; }
  .budget-pill {
    font: 600 11px var(--font-mono);
    color: var(--text-primary);
    background: var(--menu-seg-bg, rgba(0,0,0,0.05));
    border-radius: 999px;
    padding: 3px 8px;
    cursor: pointer;
    border: 0.5px solid var(--divider);
  }
  .budget-pill:hover { color: var(--accent); }
  .menu-hint {
    font-size: 10px; color: var(--text-tertiary);
    padding: 2px 2px 2px;
    line-height: 1.4;
  }
  .icon-btn.active { background: var(--icon-hover-bg); color: var(--text-primary); }

  /* ---- BUSINESS · macOS Liquid Glass ---- */
  /* Soft cool gradient stage; popover is translucent, blurred, with a
     subtle inner highlight on top. System blue accent. SF Pro stack. */
  body[data-scheme="business"] [data-mode="light"] {
    --font-sans: -apple-system, "SF Pro Text", "Helvetica Neue", "PingFang SC", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Menlo", monospace;

    --popover-bg: rgba(255, 255, 255, 0.62);
    --popover-backdrop: blur(40px) saturate(180%);
    --popover-border: 0.5px solid rgba(0, 0, 0, 0.10);
    --popover-radius: 14px;
    --popover-shadow:
      inset 0 1px 0 rgba(255,255,255,0.7),
      inset 0 0 0 0.5px rgba(255,255,255,0.4);

    --header-bg: rgba(255, 255, 255, 0.30);
    --footer-bg: rgba(255, 255, 255, 0.30);

    --text-primary: #1c1d1f;
    --text-secondary: #3c3e44;
    --text-tertiary: #6b6e76;
    --text-quat: #9b9ea5;
    --divider: rgba(0, 0, 0, 0.10);

      0 20px 50px rgba(0, 0, 0, 0.35) !important;

<script>
/* ============================================================
   TokSee — production wiring
   - Talks to Rust via Tauri IPC (get_usage / open_html_report).
   - Transforms tokkit JSON → the popover template's expected shape.
   - Persists scheme / mode / lang in localStorage.
   - Manual refresh: re-fetch only. Auto refresh (hourly from Rust):
     re-fetch + advance "下次更新 HH:MM".
   ============================================================ */

const invoke = (cmd, args) => window.__TAURI__?.core?.invoke?.(cmd, args);

/* ---- i18n ---- */
const I18N = {
  en: {
    label_today: 'TODAY · TOKENS', label_7d: '7D · TOKENS', label_14d: '14D · TOKENS', label_30d: '30D · TOKENS',
    title_today: '24H TAPE · TOKENS', title_7d: '7-DAY TAPE · TOKENS', title_14d: '14-DAY TAPE · TOKENS', title_30d: '30-DAY TAPE · TOKENS',
    period_today: '', period_7d: '', period_14d: '', period_30d: '',
    vs_dd: 'd/d', vs_ww: 'w/w', vs_pp: 'p/p', vs_mm: 'm/m',
    flag_peak: 'PEAK', flag_now: 'NOW',
    sync: 'SYNC', sync_offline: 'OFFLINE',
    records_sub: 'CALLS LOGGED', avg_sub_prefix: 'TOK · ',
    tab_today: 'Today', tab_7d: '7D', tab_14d: '14D', tab_30d: '30D',
    cost: 'COST', records: 'RECORDS', avg: 'AVG / CALL',
    model: 'MODEL', share: 'SHARE', tok: 'TOK', col_cost: 'COST',
    next: 'NEXT', report: 'Full Report ↗',
    menu_appearance: 'APPEARANCE', menu_scheme: 'THEME COLOR', menu_language: 'LANGUAGE',
    theme_light: 'Light', theme_dark: 'Dark', theme_auto: 'Auto',
    scheme_business: 'Business', scheme_vibrant: 'Vibrant', scheme_minimal: 'Minimal',
  },
  cn: {
    label_today: '今日 · TOKEN', label_7d: '近 7 天 · TOKEN', label_14d: '近 14 天 · TOKEN', label_30d: '近 30 天 · TOKEN',
    title_today: '今日 24 小时', title_7d: '近 7 天', title_14d: '近 14 天', title_30d: '近 30 天',
    period_today: '', period_7d: '', period_14d: '', period_30d: '',
    vs_dd: '日环比', vs_ww: '周环比', vs_pp: '双周环比', vs_mm: '月环比',
    flag_peak: '峰值', flag_now: '当前',
    sync: '已同步', sync_offline: '未连接',
    records_sub: '次记录', avg_sub_prefix: '均价 ',
    tab_today: '今日', tab_7d: '7 天', tab_14d: '14 天', tab_30d: '30 天',
    cost: '费用', records: '调用', avg: '单次均量',
    model: '模型', share: '占比', tok: '用量', col_cost: '费用',
    next: '下次更新', report: '完整报告 ↗',
    menu_appearance: '显示模式', menu_scheme: '主题配色', menu_language: '语言',
    theme_light: '浅色', theme_dark: '深色', theme_auto: '跟随系统',
    scheme_business: '商务', scheme_vibrant: '活泼', scheme_minimal: '极简',
  },
};

/* ---- Persisted prefs ---- */
const PREFS_KEY = 'toksee.prefs.v013';
const DEFAULTS = { scheme: 'business', mode: 'auto', lang: 'cn' };
let prefs = (() => {
  try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(PREFS_KEY) || '{}')); }
  catch { return Object.assign({}, DEFAULTS); }
})();
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {} }

let LANG = prefs.lang;
const t = (k) => (I18N[LANG] && I18N[LANG][k]) || k;

/* ---- Period mapping ---- */
const PERIOD_TO_IPC_ARG = { today: 'today', '7d': '7', '14d': '14', '30d': '30' };
const PERIOD_TO_REPORT_DAYS = { today: 1, '7d': 7, '14d': 14, '30d': 30 };

/* ---- Number formatters ---- */
function fmtTokens(n) {
  if (!n || n === 0) return '0';
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e7) return Math.round(n / 1e6) + 'M';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e4) return Math.round(n / 1e3) + 'K';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toLocaleString();
}
function fmtCost(c) {
  if (!c || c === 0) return '$0.00';
  if (c >= 100) return '$' + Math.round(c).toLocaleString();
  if (c >= 10) return '$' + c.toFixed(1);
  return '$' + c.toFixed(2);
}
function fmtCostFull(c) {
  if (!c || c === 0) return '$0.00';
  return '$' + c.toFixed(2);
}
function fmtShortDate(iso) {
  if (!iso) return '';
  const p = iso.split('-');
  if (p.length !== 3) return iso;
  return `${parseInt(p[1], 10)}/${parseInt(p[2], 10)}`;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function classifyModel(label) {
  const l = String(label || '').toLowerCase();
  if (l.includes('opus')) return 'opus';
  if (l.includes('sonnet')) return 'sonnet';
  if (l.includes('haiku')) return 'haiku';
  if (l.includes('gpt')) return 'gpt';
  return 'haiku';
}

/* ---- Period label: "本周 · 11/19 → 11/25" / "今日 · 周三 11/25" ---- */
function buildPeriodLabel(period, raw) {
  const today = new Date();
  const fmt = d => `${d.getMonth() + 1}/${d.getDate()}`;
  const weekdayCN = ['日', '一', '二', '三', '四', '五', '六'];

  if (period === 'today') {
    return LANG === 'cn'
      ? `周${weekdayCN[today.getDay()]} · ${fmt(today)}`
      : today.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
  }

  /* Try to read the date span from raw.by_date if present (most reliable). */
  const dates = (raw?.by_date || []).slice().sort((a, b) => a.local_date.localeCompare(b.local_date));
  let start, end;
  if (dates.length > 0) {
    start = new Date(dates[0].local_date + 'T00:00:00');
    end = new Date(dates[dates.length - 1].local_date + 'T00:00:00');
  } else {
    /* Fallback: derive from period count */
    const days = period === '7d' ? 6 : period === '14d' ? 13 : 29;
    end = today;
    start = new Date(today); start.setDate(today.getDate() - days);
  }
  return `${fmt(start)} → ${fmt(end)}`;
}

/* ---- Period-over-period delta: fetch the previous window, compare cost ----
   Returns { dir: 'up'|'down', val: '12.6%', vsKey: 'vs_ww' } or null. */
async function fetchPeriodDelta(period, currentCost) {
  if (period === 'today') {
    /* Compare today's cost vs yesterday's. Use 'last 2' to grab today + yesterday. */
    try {
      const raw = await invoke('get_usage', { period: '2' });
      const dates = (raw?.by_date || []).slice().sort((a, b) => a.local_date.localeCompare(b.local_date));
      if (dates.length < 2) return null;
      const tdy = todayISO();
      const todayBucket = dates.find(d => d.local_date === tdy);
      const yBucket = dates.find(d => d.local_date !== tdy);
      if (!todayBucket || !yBucket) return null;
      const cur = todayBucket.estimated_cost_usd || 0;
      const prev = yBucket.estimated_cost_usd || 0;
      if (prev <= 0) return null;
      const pct = ((cur - prev) / prev) * 100;
      return { dir: pct >= 0 ? 'up' : 'down', val: Math.abs(pct).toFixed(1) + '%', vsKey: 'vs_dd' };
    } catch { return null; }
  }

  /* For 7d/14d/30d: fetch previous-period equivalent and compare totals. */
  const days = period === '7d' ? 7 : period === '14d' ? 14 : 30;
  const vsKey = period === '7d' ? 'vs_ww' : period === '14d' ? 'vs_pp' : 'vs_mm';
  try {
    const raw2 = await invoke('get_usage', { period: String(days * 2) });
    const dates = (raw2?.by_date || []).slice().sort((a, b) => a.local_date.localeCompare(b.local_date));
    if (dates.length < days * 2) {
      /* Not enough history yet — try sub-set */
      if (dates.length < days + 1) return null;
    }
    /* Split into two halves: prev = first `days`, current = last `days`. */
    const half = Math.floor(dates.length / 2);
    const prevSlice = dates.slice(0, half);
    const curSlice = dates.slice(half);
    const prev = prevSlice.reduce((s, d) => s + (d.estimated_cost_usd || 0), 0);
    const cur = curSlice.reduce((s, d) => s + (d.estimated_cost_usd || 0), 0);
    if (prev <= 0) return null;
    const pct = ((cur - prev) / prev) * 100;
    return { dir: pct >= 0 ? 'up' : 'down', val: Math.abs(pct).toFixed(1) + '%', vsKey };
  } catch {
    return null;
  }
}

/* ---- Transform tokkit JSON → popover template's expected shape ---- */
function transformIpcData(period, raw) {
  if (!raw) return null;
  const isToday = period === 'today';
  const tdy = todayISO();

  let totalTokens = 0, totalCost = 0, totalRecords = 0;
  let series = []; // { v, isToday }[]
  let labels = []; // { i, t, now? }[]

  /* Build axis labels with dedup — never emit two labels at the same i. */
  function buildLabels(items, indices) {
    const seen = new Set();
    const out = [];
    indices.forEach(({ i, now }) => {
      if (i === undefined || i < 0 || i >= items.length || seen.has(i)) return;
      seen.add(i);
      out.push({ i, t: items[i].label, now: !!now });
    });
    return out.sort((a, b) => a.i - b.i);
  }

  /* Flag rail tracks PEAK on today view (highest hourly bar) or NOW on
     longer ranges (today's bar, or last bar if no today data yet).
     Carries the time/date label as tagSuffix so the chart-flag header
     reads "峰值 · 19:00" or "当前 · 5/8" instead of just the static word. */
  let flagTagKey = 'flag_now';
  let flagTagSuffix = '';
  let flagBarSourceTokens = 0;

  if (isToday) {
    const tot = raw.totals || {};
    totalTokens = tot.total_tokens || 0;
    totalCost = tot.estimated_cost_usd || 0;
    totalRecords = tot.records || 0;

    const hours = raw.by_hour || [];
    const nonZero = hours.filter(h => (h.total_tokens || 0) > 0);
    const useHours = nonZero.length > 0 ? nonZero : hours;
    series = useHours.map((h, i) => ({
      v: h.estimated_cost_usd || 0,
      isToday: false,
      label: (h.hour_label || '').slice(0, 5),
      _tokens: h.total_tokens || 0,
    }));
    if (series.length > 0) {
      const peakIdx = series.reduce((m, s, i) => s.v > series[m].v ? i : m, 0);
      const lastIdx = series.length - 1;

      /* chart-flag follows PEAK: tag "峰值 · 19:00", val + tokens from peak bar */
      flagTagKey = 'flag_peak';
      flagTagSuffix = series[peakIdx].label;
      flagVal = fmtCostFull(series[peakIdx].v);
      flagBarSourceTokens = series[peakIdx]._tokens;
      flagSub = fmtTokens(flagBarSourceTokens);

      /* axis: first + last only (last marked as 'now'). Peak time
         is already in the chart-flag tag, no need to also paint it
         on the axis where it would collide with last. */
      labels = buildLabels(series, [
        { i: 0 },
        { i: lastIdx, now: true },
      ]);
    }
  } else {
    const dates = (raw.by_date || []).slice().sort((a, b) => a.local_date.localeCompare(b.local_date));
    totalTokens = dates.reduce((s, d) => s + (d.total_tokens || 0), 0);
    totalCost = dates.reduce((s, d) => s + (d.estimated_cost_usd || 0), 0);
    totalRecords = dates.reduce((s, d) => s + (d.records || 0), 0);

    series = dates.map(d => ({
      v: d.estimated_cost_usd || 0,
      isToday: d.local_date === tdy,
      label: fmtShortDate(d.local_date),
      _tokens: d.total_tokens || 0,
    }));
    if (series.length > 0) {
      const lastIdx = series.length - 1;
      const midIdx = Math.floor(series.length / 2);

      /* chart-flag follows today's bar (or last if no today data). */
      const todayIdx = series.findIndex(s => s.isToday);
      const flagIdx = todayIdx >= 0 ? todayIdx : lastIdx;
      flagTagKey = 'flag_now';
      flagTagSuffix = series[flagIdx].label;
      flagVal = fmtCostFull(series[flagIdx].v);
      flagSub = fmtTokens(series[flagIdx]._tokens);

      labels = buildLabels(series, [
        { i: 0 },
        { i: midIdx },
        { i: lastIdx, now: series[lastIdx].isToday },
      ]);
    }
  }

  /* Models — sort by cost desc, top 4 */
  const models = (raw.by_model || [])
    .map(m => ({
      id: classifyModel(m.model_label),
      name: (m.model_label || '').replace(/^Claude\s+(\w+)\s+(.+)/, 'Claude $1').trim() || m.model_label,
      ver: (() => {
        const mt = String(m.model_label || '').match(/(\d+\.\d+|\d+)/);
        return mt ? mt[1] : '';
      })(),
      tokens: fmtTokens(m.total_tokens || 0),
      cost: fmtCostFull(m.estimated_cost_usd || 0),
      share: totalCost > 0 ? (m.estimated_cost_usd || 0) / totalCost : 0,
    }))
    .sort((a, b) => parseFloat(b.cost.replace(/[^\d.]/g, '')) - parseFloat(a.cost.replace(/[^\d.]/g, '')))
    .slice(0, 4);

  /* flagVal / flagSub / flagTagKey / flagTagSuffix already populated above
     (alongside the series build), so the side rail's data comes from the
     correct bar and the tag prefix follows it. */

  return {
    labelKey: `label_${period}`,
    titleKey: `title_${period}`,
    periodKey: `period_${period}`,
    hero: totalTokens,
    cost: totalCost,
    costRMB: Math.round(totalCost * 7.25).toLocaleString(),
    records: totalRecords,
    avg: totalRecords > 0 ? fmtTokens(Math.round(totalTokens / totalRecords)) : '—',
    avgCost: totalRecords > 0 ? '$' + (totalCost / totalRecords).toFixed(3) : '—',
    delta: null, /* fetched async by fetchPeriodDelta + re-render */
    total: fmtCostFull(totalCost),
    flag: { tagKey: flagTagKey, tagSuffix: flagTagSuffix, val: flagVal || '$0.00', sub: flagSub || '0' },
    series: series.map(s => s.v),
    isToday: series.map(s => s.isToday),
    labels: labels,
    models: models,
  };
}

/* ---- Boot single popover ---- */
const tmpl = document.getElementById('popover-tmpl');
const popovers = document.querySelectorAll('.popover');
popovers.forEach(p => p.appendChild(tmpl.content.cloneNode(true)));

/* Render the (single) popover with transformed data */
function renderPopover(root, period, d) {
  const $ = sel => root.querySelector(`[data-role="${sel}"]`);
  if (!d) return;

  $('strip-label-text').textContent = t(d.labelKey);
  $('strip-period').textContent = d.periodLabel || '';
  $('hero-value').textContent = (d.hero || 0).toLocaleString();

  const delta = $('hero-delta');
  if (delta) {
    if (d.delta) {
      delta.style.display = '';
      delta.classList.remove('up', 'down');
      delta.classList.add(d.delta.dir);
      const arrow = root.querySelector('[data-role="hero-arrow"]');
      const val = root.querySelector('[data-role="hero-delta-val"]');
      const vs = root.querySelector('[data-role="hero-vs"]');
      if (arrow) arrow.textContent = d.delta.dir === 'up' ? '▲' : '▼';
      if (val) val.textContent = d.delta.val;
      if (vs) vs.textContent = t(d.delta.vsKey);
    } else {
      delta.style.display = 'none';
    }
  }

  $('rail-cost').textContent = fmtCostFull(d.cost);
  $('rail-cost-sub').textContent = '≈ ¥' + d.costRMB;
  $('rail-records').textContent = (d.records || 0).toLocaleString();
  $('rail-avg').textContent = d.avg;
  $('rail-avg-sub').textContent = t('avg_sub_prefix') + d.avgCost;

  $('chart-title').textContent = t(d.titleKey);
  $('chart-total').textContent = d.total;
  /* flag-tag: "峰值 · 19:00" / "当前 · 5/8". Suffix is the time/date the
     flag is pointing at; without it the user can't tell which bar the
     side-rail value belongs to. */
  $('flag-tag').textContent = t(d.flag.tagKey) + (d.flag.tagSuffix ? ' · ' + d.flag.tagSuffix : '');
  $('flag-val').textContent = d.flag.val;
  $('flag-sub').textContent = d.flag.sub;

  const max = Math.max(...d.series, 0.001);
  const peakIdx = d.series.reduce((m, v, i, a) => v > a[m] ? i : m, 0);
  const span = d.series.length || 1;

  /* Bars: flex layout with same gap as axis grid (3px) for perfect alignment. */
  $('chart-bars').innerHTML = d.series.map((v, i) => {
    const h = v === 0 ? 0 : Math.max(2, (v / max) * 60);
    const cls = ['bar'];
    if (v === 0) cls.push('zero');
    else { if (i === peakIdx) cls.push('peak'); if (d.isToday[i]) cls.push('today'); }
    return `<div class="${cls.join(' ')}" style="height:${h}px"></div>`;
  }).join('');

  /* Axis: grid layout with same column count + gap as bars, label spans
     occupy specific columns by index — alignment is automatic. */
  const axisEl = $('chart-axis');
  axisEl.style.gridTemplateColumns = `repeat(${span}, 1fr)`;
  axisEl.innerHTML = (d.labels || []).map(l =>
    `<span class="${l.now ? 'now' : ''}" style="grid-column: ${l.i + 1};">${l.t}</span>`
  ).join('');

  root.querySelector('[data-role="models"]').innerHTML = d.models.map(m => `
    <div class="model-row" data-model="${m.id}">
      <div class="model-name-wrap">
        <div class="model-dot"></div>
        <div class="model-name">${m.name}${m.ver ? ' <span class="ver">' + m.ver + '</span>' : ''}</div>
      </div>
      <div class="model-share">
        <div class="share-bar"><span style="width:${(m.share * 100).toFixed(1)}%"></span></div>
        <div class="share-pct num">${(m.share * 100).toFixed(m.share < 0.05 ? 1 : 0)}%</div>
      </div>
      <div class="model-tok num">${m.tokens}</div>
      <div class="model-cost num">${m.cost}</div>
    </div>
  `).join('');

  root.querySelectorAll('[data-role="tabs"] .tab').forEach(tab => {
    const isActive = tab.dataset.period === period;
    tab.classList.toggle('active', isActive);
    tab.setAttribute('aria-selected', String(isActive));
  });
}

/* Apply i18n to all [data-i18n] (re-runs on lang switch) */
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  popovers.forEach(p => {
    const r = p.querySelector('[data-role="report"]');
    if (r) r.textContent = t('report');
  });
}

/* ---- Data fetch (Tauri IPC) ---- */
let _activePeriod = '7d';
async function loadAndRender(period) {
  _activePeriod = period;
  const arg = PERIOD_TO_IPC_ARG[period] || '7';
  try {
    const raw = await invoke('get_usage', { period: arg });
    if (!raw) return;
    const transformed = transformIpcData(period, raw);
    /* Period label is always derivable from raw alone (no second call). */
    transformed.periodLabel = buildPeriodLabel(period, raw);
    popovers.forEach(p => renderPopover(p, period, transformed));

    /* Period-over-period delta: fire-and-forget second IPC; if it succeeds,
       re-render the strip's delta chip. Doesn't block the main paint. */
    fetchPeriodDelta(period, transformed.cost).then(delta => {
      if (period !== _activePeriod) return; /* user switched tabs while we waited */
      if (!delta) return;
      transformed.delta = delta;
      popovers.forEach(p => renderPopover(p, period, transformed));
    });
  } catch (err) {
    console.error('[toksee] loadAndRender failed:', err);
  }
}
function currentPeriod() { return _activePeriod; }

/* ---- Tab clicks ---- */
popovers.forEach(pop => {
  pop.querySelectorAll('[data-role="tabs"] .tab').forEach(tab => {
    tab.addEventListener('click', () => loadAndRender(tab.dataset.period));
  });

  /* In-popover refresh button — manual; does NOT advance footer next-update. */
  const r = pop.querySelector('[data-role="refresh"]');
  if (r) r.addEventListener('click', e => {
    const b = e.currentTarget;
    b.style.transition = 'transform 600ms cubic-bezier(.32,.72,0,1)';
    b.style.transform = 'rotate(360deg)';
    setTimeout(() => { b.style.transform = ''; b.style.transition = ''; }, 700);
    loadAndRender(currentPeriod());
  });

  /* "完整报告" — open the tokkit HTML report scoped to active tab. */
  const reportLink = pop.querySelector('[data-role="report"]');
  if (reportLink) reportLink.addEventListener('click', async e => {
    e.preventDefault();
    const days = PERIOD_TO_REPORT_DAYS[currentPeriod()] ?? 7;
    try { await invoke('open_html_report', { lastDays: days }); }
    catch (err) { console.error('[toksee] open_html_report failed:', err); }
  });
});

/* ---- Settings menu wiring ---- */
function applyMode(mode) {
  prefs.mode = mode; savePrefs();
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const effective = mode === 'auto' ? (mq.matches ? 'dark' : 'light') : mode;
  popovers.forEach(p => { p.dataset.mode = effective; });
  document.querySelectorAll('.frame').forEach(f => { f.dataset.modeHost = effective; });
  document.querySelectorAll('[data-role="theme-seg"] .menu-seg-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.theme === mode);
  });
}
function applyScheme(scheme) {
  prefs.scheme = scheme; savePrefs();
  document.body.dataset.scheme = scheme;
  document.querySelectorAll('[data-role="scheme-seg"] .menu-seg-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.scheme === scheme);
  });
}
function applyLang(lang) {
  prefs.lang = lang; LANG = lang; savePrefs();
  document.querySelectorAll('[data-role="lang-seg"] .menu-seg-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  applyI18n();
  loadAndRender(currentPeriod());
}

popovers.forEach(pop => {
  const menu = pop.querySelector('[data-role="settings"]');
  const gear = pop.querySelectorAll('.icon-btn')[1];
  if (!gear || !menu) return;

  gear.addEventListener('click', e => {
    e.stopPropagation();
    const opening = !menu.classList.contains('open');
    document.querySelectorAll('.settings-menu.open').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.icon-btn.active').forEach(b => b.classList.remove('active'));
    if (opening) { menu.classList.add('open'); gear.classList.add('active'); }
  });

  menu.querySelectorAll('[data-role="theme-seg"] .menu-seg-btn').forEach(btn => {
    btn.addEventListener('click', () => applyMode(btn.dataset.theme));
  });
  menu.querySelectorAll('[data-role="scheme-seg"] .menu-seg-btn').forEach(btn => {
    btn.addEventListener('click', () => applyScheme(btn.dataset.scheme));
  });
  menu.querySelectorAll('[data-role="lang-seg"] .menu-seg-btn').forEach(btn => {
    btn.addEventListener('click', () => applyLang(btn.dataset.lang));
  });

  menu.addEventListener('click', e => e.stopPropagation());
});

document.addEventListener('click', () => {
  document.querySelectorAll('.settings-menu.open').forEach(m => m.classList.remove('open'));
  document.querySelectorAll('.icon-btn.active').forEach(b => b.classList.remove('active'));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.settings-menu.open').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.icon-btn.active').forEach(b => b.classList.remove('active'));
  }
});

/* ---- Live status + next-update tick ----
   Status (HH:MM:SS) ticks every second.
   next-update ticks once at startup + on every "auto" refresh from Rust.
*/
function updateStatus() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  popovers.forEach(p => {
    const s = p.querySelector('[data-role="status"]');
    if (s) s.textContent = `${t('sync')} · ${hh}:${mm}:${ss}`;
  });
}
function updateNextRefresh() {
  const next = new Date(); next.setHours(next.getHours() + 1, 0, 0, 0);
  const nh = String(next.getHours()).padStart(2, '0');
  const nm = String(next.getMinutes()).padStart(2, '0');
  popovers.forEach(p => {
    const n = p.querySelector('[data-role="next-update"]');
    if (n) n.textContent = `${nh}:${nm}`;
  });
}

/* ---- Auto refresh from Rust (every clock-aligned hour) ----
   Rust dispatches CustomEvent('toksee:refresh', { detail: { source } });
   "auto" → re-fetch + advance next-update; "manual" → re-fetch only.
*/
window.addEventListener('toksee:refresh', e => {
  loadAndRender(currentPeriod());
  if (e.detail?.source === 'auto') updateNextRefresh();
});

/* ---- React to system dark/light flip when in "auto" mode ---- */
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (prefs.mode === 'auto') applyMode('auto');
});

/* ---- Boot ---- */
applyScheme(prefs.scheme);
applyMode(prefs.mode);
applyLang(prefs.lang);
applyI18n();
updateStatus(); setInterval(updateStatus, 1000);
updateNextRefresh();
loadAndRender('7d');
</script>

</body>
